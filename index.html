<!DOCTYPE html>
<html lang="bn">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>প্রফেশনাল ফ্রেম এডিটর</title>
    <style>
        body { font-family: 'Arial', sans-serif; text-align: center; background: #f0f2f5; margin: 0; padding: 20px; }
        .editor-container { background: white; padding: 20px; border-radius: 15px; display: inline-block; box-shadow: 0 4px 15px rgba(0,0,0,0.1); max-width: 100%; }
        #canvas-wrapper { position: relative; width: 500px; height: 500px; background: #eee; margin: 20px auto; overflow: hidden; cursor: move; border: 2px solid #ddd; }
        canvas { position: absolute; top: 0; left: 0; }
        .controls { margin: 20px 0; }
        input[type="range"] { width: 200px; margin: 10px 0; }
        .btn { background: #28a745; color: white; border: none; padding: 12px 25px; border-radius: 5px; cursor: pointer; font-size: 16px; font-weight: bold; }
        .btn-upload { background: #007bff; margin-bottom: 10px; }
        p { color: #666; font-size: 14px; }
    </style>
</head>
<body>

    <div class="editor-container">
        <h2>ফ্রেম এডিটর</h2>
        <p>ছবি আপলোড করে জুম এবং পজিশন সেট করুন</p>

        <input type="file" id="upload" accept="image/*" style="display:none">
        <button class="btn btn-upload" onclick="document.getElementById('upload').click()">১. ছবি আপলোড করুন</button>

        <div id="canvas-wrapper">
            <canvas id="editorCanvas"></canvas>
        </div>

        <div class="controls">
            <label>জুম ইন/আউট:</label><br>
            <input type="range" id="zoom" min="0.1" max="3" step="0.01" value="1"><br>
            <button class="btn" id="download">২. ডাউনলোড করুন</button>
        </div>
    </div>

    <script>
        const canvas = document.getElementById('editorCanvas');
        const ctx = canvas.getContext('2d');
        const upload = document.getElementById('upload');
        const zoomInput = document.getElementById('zoom');
        const downloadBtn = document.getElementById('download');

        let userImg = new Image();
        let frameImg = new Image();
        let imgX = 0, imgY = 0, imgScale = 1;
        let isDragging = false;
        let startX, startY;

        // আপনার ফ্রেমের লিঙ্ক (PNG হতে হবে যার মাঝখান ফাঁকা)
        frameImg.crossOrigin = "anonymous";
        frameImg.src = 'frame.png'; // এখানে আপনার আসল ফ্রেম লিঙ্ক দিন

        canvas.width = 1000;
        canvas.height = 1000;

        function draw() {
            ctx.clearRect(0, 0, canvas.width, canvas.height);
            
            if (userImg.src) {
                ctx.save();
                ctx.translate(canvas.width/2 + imgX, canvas.height/2 + imgY);
                ctx.scale(imgScale, imgScale);
                ctx.drawImage(userImg, -userImg.width/2, -userImg.height/2);
                ctx.restore();
            }

            ctx.drawImage(frameImg, 0, 0, canvas.width, canvas.height);
        }

        upload.onchange = (e) => {
            const reader = new FileReader();
            reader.onload = (event) => {
                userImg.onload = () => {
                    // শুরুতে ছবি মাঝখানে সেট করা
                    imgScale = Math.max(canvas.width / userImg.width, canvas.height / userImg.height);
                    zoomInput.value = imgScale;
                    imgX = 0; imgY = 0;
                    draw();
                };
                userImg.src = event.target.result;
            };
            reader.readAsDataURL(e.target.files[0]);
        };

        zoomInput.oninput = (e) => {
            imgScale = parseFloat(e.target.value);
            draw();
        };

        // ড্র্যাগিং ফাংশন (মাউস এবং টাচ)
        const startDrag = (e) => {
            isDragging = true;
            const pos = e.touches ? e.touches[0] : e;
            startX = pos.clientX - imgX;
            startY = pos.clientY - imgY;
        };

        const stopDrag = () => isDragging = false;

        const doDrag = (e) => {
            if (!isDragging) return;
            const pos = e.touches ? e.touches[0] : e;
            imgX = pos.clientX - startX;
            imgY = pos.clientY - startY;
            draw();
        };

        const wrapper = document.getElementById('canvas-wrapper');
        wrapper.addEventListener('mousedown', startDrag);
        window.addEventListener('mouseup', stopDrag);
        window.addEventListener('mousemove', doDrag);
        
        wrapper.addEventListener('touchstart', startDrag);
        window.addEventListener('touchend', stopDrag);
        window.addEventListener('touchmove', doDrag);

        frameImg.onload = draw;

        downloadBtn.onclick = () => {
            const link = document.createElement('a');
            link.download = 'edited_photo.png';
            link.href = canvas.toDataURL('image/png');
            link.click();
        };
    </script>
</body>
</html>
